<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d08">
<title>ТРОН</title>
<link rel="icon" href="img/icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="viewport">
  <div id="stage">

    <!-- ================= МЕНЮ ================= -->
    <section id="menu" class="screen">
      <div class="menu-inner">
        <img class="logo" src="img/icon.png" alt="">
        <h1 class="title">ТРОН</h1>
        <p class="subtitle">Битва за Трон: 30 здоровья, мана растёт каждый ход, существа бьются насмерть</p>
        <h3 class="menu-h">Выберите поле боя</h3>
        <div id="hero-list" class="hero-list"></div>
        <div class="opp-pick">
          <label class="extra-pick"><input type="checkbox" id="extra-toggle" checked> Карты без картинок в колоде</label>
        </div>
        <div class="menu-buttons">
          <button class="btn btn-gold" id="btn-start">⚔ В бой</button>
          <button class="btn" id="btn-gallery">🃏 Коллекция</button>
          <button class="btn" id="btn-rules">📜 Правила</button>
          <button class="btn btn-sound" title="Звук">🔊</button>
        </div>
      </div>
    </section>

    <!-- ================= ИГРА ================= -->
    <section id="game" class="screen hidden">
      <div id="field-op" class="field"></div>
      <div id="field-me" class="field"></div>

      <div id="left">
        <div id="preview" class="preview"></div>
        <div id="log" class="log"></div>
      </div>

      <div id="arena">
        <div id="op-hand"></div>
        <div id="op-zone" class="hero-zone"></div>
        <div id="op-board" class="lane" data-side="1"></div>
        <div class="divider"><span class="torch l">🔥</span><div id="hint"></div><span class="torch r">🔥</span></div>
        <div id="me-board" class="lane" data-side="0"></div>
        <div id="me-zone" class="hero-zone"></div>
      </div>

      <div id="right">
        <div id="op-info" class="info"></div>
        <button class="btn btn-end" id="btn-end">Конец хода</button>
        <div id="me-info" class="info"></div>
        <div class="right-buttons">
          <button class="btn btn-small btn-sound" title="Звук">🔊</button>
          <button class="btn btn-small" id="btn-menu" title="В меню">☰</button>
        </div>
      </div>

      <div id="hand"></div>
      <div id="played"></div>

      <div id="light"><div class="l-me"></div><div class="l-op"></div><div class="l-flicker"></div></div>
      <canvas id="fx-canvas" width="1600" height="900"></canvas>
      <div id="fx-layer"></div>
    </section>

    <!-- ================= КОЛЛЕКЦИЯ ================= -->
    <section id="gallery" class="screen hidden">
      <div class="gal-head">
        <button class="btn btn-small" id="btn-gal-back">← Назад</button>
        <div id="gal-tabs" class="gal-tabs"></div>
      </div>
      <div class="gal-body">
        <div id="gal-grid" class="gal-grid"></div>
        <div id="gal-preview" class="preview"></div>
      </div>
    </section>

    <div id="banner" class="banner hidden"><div class="banner-text"></div><div class="banner-sub"></div></div>
    <div id="modal" class="modal hidden"></div>
  </div>
</div>
<div id="rotate-hint">↻ Поверните телефон горизонтально — так удобнее играть</div>

<script src="js/cards.js"></script>
<script src="js/engine.js"></script>
<script src="js/ai.js"></script>
<script src="js/audio.js"></script>
<script src="js/fx.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
